[project]
name = "compas_studio"
version = "0.1.0"
description = "A small COMPAS-based Grasshopper plugin set, developed and tested outside Rhino."
requires-python = ">=3.9"
dependencies = ["compas>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

# uv resolves and locks these; they are never part of the published wheel.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]                # the spec; scripts/tests checks the build scripts

# Read by scripts/ghuser.py and scripts/dev.py.
[tool.ghuser]
builder = "1.2.1"                                         # ghuser-builder release: image + dev tools
builder-repo = "https://github.com/rccn-dev/ghuser-builder"
yak-name = "compas-studio"                                # the Rhino package; PACKAGE in every code.py
yak-include = ["src/compas_studio:lib/compas_studio"]     # the core travels inside the .yak
