<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="120.0" y="24.0" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" xml:space="preserve">one class</text>
<rect x="20.0" y="45.0" width="200.0" height="93.0" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
<text x="30.0" y="65.0" font-size="13" fill="#7048e8" text-anchor="start" font-weight="bold" xml:space="preserve" font-family="Menlo, Consolas, monospace">class Beam</text>
<line x1="20.0" y1="74.0" x2="220.0" y2="74.0" stroke="#7048e8" stroke-width="1" stroke-linecap="round"/>
<text x="30.0" y="92.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">__init__(self, ...)</text>
<text x="30.0" y="111.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">length(self)</text>
<text x="30.0" y="130.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">volume(self)</text>
<text x="120.0" y="170.0" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal" xml:space="preserve">the definition: it holds</text>
<text x="120.0" y="186.0" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal" xml:space="preserve">no beam, and no numbers</text>
<text x="420.0" y="24.0" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" xml:space="preserve">as many objects as you make</text>
<rect x="310.0" y="45.0" width="220.0" height="112.0" rx="5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="320.0" y="65.0" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="bold" xml:space="preserve" font-family="Menlo, Consolas, monospace">post</text>
<line x1="310.0" y1="74.0" x2="530.0" y2="74.0" stroke="#1c7ed6" stroke-width="1" stroke-linecap="round"/>
<text x="320.0" y="92.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">start = (0, 0, 0)</text>
<text x="320.0" y="111.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">end   = (0, 0, 2400)</text>
<text x="320.0" y="130.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">width = 120</text>
<text x="320.0" y="149.0" font-size="12" fill="#1c7ed6" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">post.length() -&gt; 2400</text>
<rect x="310.0" y="181.0" width="220.0" height="112.0" rx="5" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
<text x="320.0" y="201.0" font-size="13" fill="#e8590c" text-anchor="start" font-weight="bold" xml:space="preserve" font-family="Menlo, Consolas, monospace">plate</text>
<line x1="310.0" y1="210.0" x2="530.0" y2="210.0" stroke="#e8590c" stroke-width="1" stroke-linecap="round"/>
<text x="320.0" y="228.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">start = (0, 0, 2400)</text>
<text x="320.0" y="247.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">end   = (3600, 0, 2400)</text>
<text x="320.0" y="266.0" font-size="12" fill="#212529" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">width = 100</text>
<text x="320.0" y="285.0" font-size="12" fill="#e8590c" text-anchor="start" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">plate.length() -&gt; 3600</text>
<line x1="222.0" y1="85.0" x2="308.0" y2="85.0" stroke="#7048e8" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="308.0,85.0 300.8,88.5 300.8,81.5" fill="#7048e8" stroke="#7048e8" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="222.0" y1="95.0" x2="308.0" y2="207.0" stroke="#7048e8" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="308.0,207.0 300.9,203.4 306.4,199.2" fill="#7048e8" stroke="#7048e8" stroke-width="1.5" stroke-linejoin="round"/>
<text x="265.0" y="77.0" font-size="11" fill="#7048e8" text-anchor="middle" font-weight="normal" xml:space="preserve" font-family="Menlo, Consolas, monospace">Beam(...)</text>
<text x="735.0" y="24.0" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" xml:space="preserve">the two beams, to scale</text>
<rect x="595.5" y="130.0" width="9.0" height="180.0" rx="1" fill="#a5d8ff" stroke="#1c7ed6" stroke-width="1.5"/>
<rect x="596.2" y="126.2" width="273.8" height="7.5" rx="1" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="590.0" y="220.0" font-size="13" fill="#1c7ed6" text-anchor="end" font-weight="bold" xml:space="preserve">post</text>
<text x="730.0" y="118.0" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold" xml:space="preserve">plate</text>
<line x1="20.0" y1="345.0" x2="880.0" y2="345.0" stroke="#f1f3f5" stroke-width="1" stroke-linecap="round"/>
<text x="20.0" y="362.0" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="bold" xml:space="preserve" font-family="Menlo, Consolas, monospace">post.length()</text>
<text x="135.0" y="362.0" font-size="12" fill="#495057" text-anchor="start" font-weight="normal" xml:space="preserve">is the same call as</text>
<text x="250.0" y="362.0" font-size="13" fill="#7048e8" text-anchor="start" font-weight="bold" xml:space="preserve" font-family="Menlo, Consolas, monospace">Beam.length(post)</text>
<text x="395.0" y="362.0" font-size="12" fill="#495057" text-anchor="start" font-weight="normal" xml:space="preserve">: inside the method, self is the object before the dot.</text>
</svg>
